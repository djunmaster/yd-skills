<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模型网关 · Universal UI</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="blocks.css">
  <script defer src="demo.js"></script>
</head>
<body>
  <main class="sample" data-template="gateway">
    <header class="heading">
      <div><h1>模型网关</h1><p class="meta">本地演示 · 未连接真实服务</p></div>
      <button class="control" type="button" data-theme-toggle>深色预览</button>
    </header>

    <section class="panel" aria-labelledby="provider-title">
      <header class="panel-head"><h2 id="provider-title">提供方</h2><span class="meta">状态与最近一次响应延迟</span></header>
      <div class="provider-list">
        <div class="provider-row" data-provider data-latency="184" data-health="success">
          <span class="provider-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="8" rx="2"/><rect x="3" y="13" width="18" height="8" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg></span>
          <div class="provider-copy"><strong>Atlas</strong><small>atlas.example/v1 · 8 个模型</small></div>
          <span class="badge" data-tone="success">可用</span><span class="number meta" data-latency-label>184 ms</span>
          <input class="switch" type="checkbox" role="switch" aria-label="启用 Atlas" checked>
        </div>
        <div class="provider-row" data-provider data-latency="684" data-health="warning">
          <span class="provider-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="8" rx="2"/><rect x="3" y="13" width="18" height="8" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg></span>
          <div class="provider-copy"><strong>Bridge</strong><small>bridge.example/v1 · 4 个模型</small></div>
          <span class="badge" data-tone="warning">延迟偏高</span><span class="number meta" data-latency-label>684 ms</span>
          <input class="switch" type="checkbox" role="switch" aria-label="启用 Bridge" checked>
        </div>
        <div class="provider-row" data-provider data-latency="230" data-health="success">
          <span class="provider-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="8" rx="2"/><rect x="3" y="13" width="18" height="8" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg></span>
          <div class="provider-copy"><strong>Relay</strong><small>relay.example/v1 · 2 个模型</small></div>
          <span class="badge">未启用</span><span class="number meta" data-latency-label>—</span>
          <input class="switch" type="checkbox" role="switch" aria-label="启用 Relay">
        </div>
      </div>
      <p class="record-foot meta" role="status" aria-atomic="true" data-status></p>
    </section>
  </main>
</body>
</html>
