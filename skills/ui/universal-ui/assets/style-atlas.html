<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Universal UI Style Atlas</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="blocks.css">
  <link rel="stylesheet" href="style-atlas.css">
  <script src="demo.js" defer></script>
  <script src="style-atlas.js" defer></script>
</head>
<body data-template="style-atlas">
  <button class="control" type="button" data-theme-toggle>切换主题</button>
  <p data-status>本地风格图谱已加载</p>
  <main class="atlas-shell" aria-labelledby="atlas-title">
    <header class="atlas-header">
      <div>
        <p class="atlas-kicker">Universal UI · Style Atlas</p>
        <h1 id="atlas-title">56 个克制风格样张</h1>
        <p class="atlas-summary">同一个小界面，换不同字体、密度、圆角、边框、阴影和色彩。名字只是索引，看样张再决定。</p>
      </div>
      <div class="atlas-actions" role="group" aria-label="风格筛选">
        <button class="control" type="button" data-family="all" aria-pressed="true">全部风格</button>
        <button class="control" type="button" data-family="neutral" aria-pressed="false">中性风格</button>
        <button class="control" type="button" data-family="quiet" aria-pressed="false">安静风格</button>
        <button class="control" type="button" data-family="technical" aria-pressed="false">技术风格</button>
        <button class="control" type="button" data-family="data" aria-pressed="false">数据风格</button>
        <button class="control" type="button" data-family="soft" aria-pressed="false">柔和风格</button>
        <button class="control" type="button" data-family="editorial" aria-pressed="false">编辑风格</button>
        <button class="control" type="button" data-family="compact" aria-pressed="false">紧凑风格</button>
        <button class="control" type="button" data-family="dark" aria-pressed="false">深色风格</button>
      </div>
    </header>

    <section class="atlas-legend" aria-label="样张说明">
      <p>每张卡片只保留四件事：名字、来源、适用和一个小界面。不做长文案。</p>
    </section>

    <section class="atlas-grid" id="atlas-grid" aria-live="polite" aria-label="风格样张列表"></section>
  </main>
</body>
</html>
