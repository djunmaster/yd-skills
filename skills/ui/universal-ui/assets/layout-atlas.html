<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Universal UI Layout Atlas</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="blocks.css">
  <link rel="stylesheet" href="layout-atlas.css">
  <script src="demo.js" defer></script>
  <script src="layout-atlas.js" defer></script>
</head>
<body data-template="layout-atlas">
  <button class="control" type="button" data-theme-toggle>切换主题</button>
  <p data-status>已展示 36 个页面布局方案</p>

  <main class="atlas-shell" aria-labelledby="atlas-title">
    <header class="atlas-header">
      <div>
        <p class="atlas-kicker">Universal UI · Layout Atlas</p>
        <h1 id="atlas-title">36 个页面布局方案</h1>
        <p class="atlas-summary">12 类产品页面，每类给出稳妥、紧凑、个性三个方案。看首屏结构、层级和颜色在真实布局里的效果。</p>
      </div>
      <div class="atlas-actions" role="group" aria-label="布局类型筛选">
        <button class="control" type="button" data-layout="all" aria-pressed="true">全部布局</button>
        <button class="control" type="button" data-layout="agent" aria-pressed="false">Agent 工作台</button>
        <button class="control" type="button" data-layout="notes" aria-pressed="false">笔记知识库</button>
        <button class="control" type="button" data-layout="data" aria-pressed="false">数据后台</button>
        <button class="control" type="button" data-layout="monitor" aria-pressed="false">监控排障</button>
        <button class="control" type="button" data-layout="config" aria-pressed="false">配置设置</button>
        <button class="control" type="button" data-layout="records" aria-pressed="false">记录管理</button>
        <button class="control" type="button" data-layout="finance" aria-pressed="false">账务财务</button>
        <button class="control" type="button" data-layout="utility" aria-pressed="false">小工具</button>
        <button class="control" type="button" data-layout="content" aria-pressed="false">内容页面</button>
        <button class="control" type="button" data-layout="search" aria-pressed="false">搜索结果</button>
        <button class="control" type="button" data-layout="empty" aria-pressed="false">空态引导</button>
        <button class="control" type="button" data-layout="form" aria-pressed="false">表单流程</button>
      </div>
    </header>

    <section class="atlas-legend" aria-label="使用说明">
      <p>每个方案只标注布局意图、主要风格和一个注意点。先看结构是否成立，再评价颜色是否加分。</p>
    </section>

    <section class="atlas-grid" id="atlas-grid" aria-live="polite" aria-label="页面布局方案"></section>
  </main>
</body>
</html>
