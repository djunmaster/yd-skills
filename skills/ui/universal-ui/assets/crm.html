<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客户管理 · Universal UI</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="blocks.css">
  <script defer src="demo.js"></script>
</head>
<body>
  <main class="sample" data-template="crm">
    <header class="heading">
      <div><h1>客户管理</h1><p class="meta">本地演示数据</p></div>
      <button class="control" type="button" data-theme-toggle>深色预览</button>
    </header>

    <section class="panel" aria-labelledby="accounts-title">
      <header class="panel-head"><h2 id="accounts-title">客户列表</h2><span class="meta">收入按人民币元计</span></header>
      <div class="toolbar">
        <input class="control" data-search type="search" aria-label="搜索客户" placeholder="搜索客户…">
        <div class="field">
          <select class="control" data-owner aria-label="按负责人筛选"><option value="all">全部负责人</option><option>林予安</option><option>陆川</option></select>
          <button class="control" type="button" data-reset>清除筛选</button>
        </div>
      </div>
      <div class="table-scroll" role="region" aria-label="客户记录，可横向滚动" tabindex="0" data-records>
        <table class="records" aria-labelledby="accounts-title">
          <thead><tr><th scope="col">客户</th><th scope="col">续约状态</th><th scope="col">负责人</th><th scope="col" class="number" aria-sort="descending"><button class="sort" type="button" data-sort>月度收入 <span aria-hidden="true">↓</span></button></th></tr></thead>
          <tbody>
            <tr data-amount="12800"><th scope="row">知行科技</th><td><span class="badge" data-tone="success">健康</span></td><td>林予安</td><td class="number">¥12,800</td></tr>
            <tr data-amount="9600"><th scope="row">青岚零售</th><td><span class="badge" data-tone="warning">待跟进</span></td><td>陆川</td><td class="number">¥9,600</td></tr>
            <tr data-amount="7200"><th scope="row">远洋物流</th><td><span class="badge" data-tone="success">健康</span></td><td>林予安</td><td class="number">¥7,200</td></tr>
            <tr data-amount="0"><th scope="row">和光设计</th><td><span class="badge">试用中</span></td><td>陆川</td><td class="number">¥0</td></tr>
          </tbody>
        </table>
      </div>
      <div class="data-state" data-state-panel hidden><strong data-state-title></strong><p class="meta" data-state-detail></p><button class="control" type="button" data-retry hidden>重试</button></div>
      <p class="record-foot meta" role="status" aria-atomic="true" data-status></p>
    </section>
  </main>
</body>
</html>
