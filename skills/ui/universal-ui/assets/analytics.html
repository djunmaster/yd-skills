<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>收入分析 · Universal UI</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="blocks.css">
  <script defer src="demo.js"></script>
</head>
<body>
  <main class="sample" data-template="analytics">
    <header class="heading">
      <div><h1>收入分析</h1><p class="meta">本地演示数据</p></div>
      <button class="control" type="button" data-theme-toggle>深色预览</button>
    </header>

    <dl class="metrics" aria-label="收入摘要">
      <div><dt>总收入</dt><dd data-metric="revenue">¥0</dd><dd class="metric-note">所选周期合计</dd></div>
      <div><dt>月度经常性收入</dt><dd data-metric="mrr">¥0</dd><dd class="metric-note">周期末 MRR</dd></div>
      <div><dt>访问会话</dt><dd data-metric="sessions">0</dd><dd class="metric-note">所选周期合计</dd></div>
      <div><dt>转化率</dt><dd data-metric="conversion">0%</dd><dd class="metric-note">付费订单 / 访问</dd></div>
    </dl>

    <section class="panel" aria-labelledby="trend-title">
      <header class="panel-head with-actions">
        <div><h2 id="trend-title">收入趋势</h2><p class="meta">人民币元 · 按月合计</p></div>
        <div class="segmented" role="group" aria-label="收入周期">
          <button type="button" data-range="3" aria-pressed="false">近 3 个月</button>
          <button type="button" data-range="6" aria-pressed="true">近 6 个月</button>
        </div>
      </header>
      <figure class="chart">
        <figcaption class="legend meta"><span class="legend-dot" aria-hidden="true"></span>总收入</figcaption>
        <div class="chart-grid" aria-hidden="true">
          <div class="chart-axis vertical"><span>250,000</span><span>125,000</span><span>0</span></div>
          <svg class="plot" viewBox="0 0 500 200" preserveAspectRatio="none" aria-hidden="true">
            <path class="grid-line" d="M0 0H500 M0 100H500 M0 200H500"></path>
            <polygon class="area"></polygon>
            <polyline class="trend"></polyline>
          </svg>
          <div class="chart-axis horizontal" data-axis></div>
        </div>
      </figure>
      <details class="data-disclosure"><summary>查看月度收入明细</summary><dl data-chart-values></dl></details>
      <p class="record-foot meta" role="status" aria-atomic="true" data-status></p>
    </section>
  </main>
</body>
</html>
