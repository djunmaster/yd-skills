<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>universal-ui v2.0 · 现成页面模板与布局骨架全景图谱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }

:root, [data-theme="dark"] {
  --canvas: #1c1c1c;
  --sidebar: #171717;
  --surface: #232323;
  --subtle: #2a2a2a;
  --hover: #2f2f2f;
  --line: rgba(255, 255, 255, 0.075);
  --line-strong: rgba(255, 255, 255, 0.14);
  --ink: #ececec;
  --ink-2: #b8b8b8;
  --muted: #808080;
  --action: #ececec;
  --action-fg: #171717;
  --accent: #3b82f6;
  --accent-soft: rgba(59, 130, 246, 0.14);
  --green: #4ade80;
  --green-soft: rgba(74, 222, 128, 0.12);
  --amber: #fbbf24;
  --amber-soft: rgba(251, 191, 36, 0.12);
  --violet: #c3b5f5;
  --violet-soft: rgba(195, 181, 245, 0.13);
  --wf-bg: #181818;
  --wf-block: #2c2c2c;
  --wf-hi: #3f3f46;
}

[data-theme="light"] {
  --canvas: #f6f6f7;
  --sidebar: #efeff1;
  --surface: #ffffff;
  --subtle: #f1f1f4;
  --hover: #eaeaeD;
  --line: rgba(24, 24, 27, 0.08);
  --line-strong: rgba(24, 24, 27, 0.15);
  --ink: #18181b;
  --ink-2: #4a4a52;
  --muted: #71717a;
  --action: #18181b;
  --action-fg: #ffffff;
  --accent: #2563eb;
  --accent-soft: rgba(37, 99, 235, 0.10);
  --green: #15803d;
  --green-soft: rgba(21, 128, 61, 0.10);
  --amber: #b45309;
  --amber-soft: rgba(180, 83, 9, 0.10);
  --violet: #7055b4;
  --violet-soft: rgba(112, 85, 180, 0.11);
  --wf-bg: #f4f4f6;
  --wf-block: #e4e4e9;
  --wf-hi: #d1d1da;
}

body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  font-size: 14px;
  line-height: 1.55;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}

.mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11.5px; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--sidebar);
  border-bottom: 1px solid var(--line);
  padding: 11px 24px;
}

.topbar-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.seg {
  display: inline-flex;
  background: var(--subtle);
  padding: 3px;
  border-radius: 9px;
  gap: 2px;
}
.seg button {
  border: none;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 500;
  padding: 5px 12px;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
}
.seg button.active {
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
}

.btn-flat {
  height: 30px;
  padding: 0 11px;
  border-radius: 8px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
.btn-flat:hover { background: var(--hover); }

.wrap {
  max-width: 1280px;
  margin: 0 auto;
  padding: 26px 24px 64px;
}

.sec-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-end;
  gap: 12px;
  margin-bottom: 18px;
}
.sec-head h1, .sec-head h2 {
  margin: 0;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.sec-head p {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--muted);
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 999px;
  white-space: nowrap;
}
.pill.v1 { background: var(--violet-soft); color: var(--violet); }
.pill.v2 { background: var(--green-soft); color: var(--green); }
.pill.opt { background: var(--amber-soft); color: var(--amber); }
.pill.neu { background: var(--subtle); color: var(--ink-2); }

/* Template Cards Grid */
.tpl-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.tpl-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 11px;
  cursor: pointer;
  transition: border-color 140ms ease, transform 140ms ease;
}
.tpl-card:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.tpl-card.selected { border-color: var(--accent); }

.wf-box {
  background: var(--wf-bg);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 10px;
  height: 118px;
  overflow: hidden;
}
.wf-box svg { display: block; width: 100%; height: 100%; }

.tpl-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.tpl-title { font-size: 14.5px; font-weight: 600; }
.tpl-file { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted); margin-top: 2px; }
.tpl-desc { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; margin: 0; }
.tpl-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 9px;
  border-top: 1px solid var(--line);
  font-size: 11.5px;
  color: var(--muted);
}

/* Detail Inspector Banner (Appears when clicking any card) */
.inspector {
  margin-top: 20px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  padding: 20px 22px;
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr;
  gap: 20px;
}
.insp-col h3 {
  margin: 0 0 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
}
.insp-list {
  margin: 0;
  padding-left: 16px;
  font-size: 12.8px;
  color: var(--ink-2);
  line-height: 1.65;
}

/* Layout Skeletons Section */
.sec-divider {
  margin-top: 44px;
  padding-top: 32px;
  border-top: 1px solid var(--line);
}

.layout-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}

.lay-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 13px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.lay-wf {
  height: 78px;
  background: var(--wf-bg);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 7px;
}
.lay-wf svg { width: 100%; height: 100%; display: block; }

.lay-name { font-size: 13.2px; font-weight: 600; }
.lay-use { font-size: 12px; color: var(--muted); line-height: 1.45; }

@media (max-width: 1020px) {
  .tpl-grid { grid-template-columns: repeat(2, 1fr); }
  .layout-grid { grid-template-columns: repeat(2, 1fr); }
  .inspector { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .tpl-grid, .layout-grid { grid-template-columns: 1fr; }
}
</style>
</head>

</header>

<main class="wrap">

  <!-- SECTION 1: ALL PAGE TEMPLATES -->
  <div class="sec-head">

      </div>
    </div>
    <div class="layout-grid" id="layoutGrid"></div>
  </div>

</main>

let curFilter = "all";
let selectedId = "codex";

function renderTemplates() {
  const rows = TEMPLATES.filter(t => curFilter === "all" || t.src === curFilter);
  document.getElementById("tplCountText").textContent = `显示 ${rows.length} / ${TEMPLATES.length} 个模板`;
  if (!rows.some(r => r.id === selectedId) && rows.length) selectedId = rows[0].id;

  const grid = document.getElementById("tplGrid");
  grid.innerHTML = rows.map(t => `
    <article class="tpl-card ${t.id === selectedId ? "selected" : ""}" data-id="${t.id}">
      <div class="wf-box">${t.svg}</div>
      <div class="tpl-top">
        <div>
          <div class="tpl-title">${t.name}</div>
          <div class="tpl-file">${t.file}</div>
        </div>
        <span class="pill ${t.src === "v1" ? "v1" : "v2"}">${t.badge}</span>
      </div>
      <p class="tpl-desc">${t.desc}</p>
      <div class="tpl-foot">
        <span>色盘：${t.palette}</span>
        <span>查看拆解 →</span>
      </div>
    </article>
  `).join("");

  grid.querySelectorAll(".tpl-card").forEach(c => {
    c.addEventListener("click", () => {
      selectedId = c.dataset.id;
      renderTemplates();
    });
  });

  const sel = TEMPLATES.find(t => t.id === selectedId) || TEMPLATES[0];
  document.getElementById("tplInspector").innerHTML = `
    <div class="insp-col">
      <h3>当前选中：${sel.name}（区块结构拆解）</h3>
      <ul class="insp-list">${sel.blocks.map(b => `<li>${b}</li>`).join("")}</ul>
    </div>
    <div class="insp-col">
      <h3>可直接局部拆用的组件</h3>
      <ul class="insp-list">${sel.reuse.map(r => `<li>${r}</li>`).join("")}</ul>
    </div>
    <div class="insp-col">
      <h3>下一步可继续优化的空间</h3>
      <ul class="insp-list">${sel.improve.map(i => `<li>${i}</li>`).join("")}</ul>
    </div>
  `;
}

function renderLayouts() {
  document.getElementById("layoutGrid").innerHTML = LAYOUTS.map(l => `
    <div class="lay-card">
      <div class="lay-wf">${l.svg}</div>
      <div class="lay-name">${l.name}</div>
      <div class="lay-use">${l.use}</div>
    </div>
  `).join("");
}

document.querySelectorAll("#filterSeg button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("#filterSeg button").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  curFilter = b.dataset.f;
  renderTemplates();
}));

document.getElementById("themeBtn").addEventListener("click", e => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  e.currentTarget.textContent = dark ? "切换深色" : "切换浅色";
});

renderTemplates();
renderLayouts();
</script>
