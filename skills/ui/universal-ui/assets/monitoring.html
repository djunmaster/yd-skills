<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>服务监控 · Universal UI</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="blocks.css">
  <script defer src="demo.js"></script>
</head>
<body>
  <main class="sample" data-template="monitoring">
    <header class="heading">
      <div><h1>服务监控</h1><p class="meta">本地演示数据</p></div>
      <button class="control" type="button" data-theme-toggle>深色预览</button>
    </header>

    <section class="panel" aria-labelledby="timeline-title">
      <header class="panel-head">
        <h2 id="timeline-title">状态时间线</h2><span class="meta">最近 30 个采样窗口 · 近 24h 可用率</span>
        <label class="field"><span>服务</span><select class="control" data-service><option value="all">全部服务</option><option value="api">api-gateway</option><option value="payments">payments</option><option value="search">search</option></select></label>
      </header>
      <div class="timeline-list">
        <div class="timeline-row" data-service-id="api" data-windows="000000000000000010000000000000">
          <strong>api-gateway</strong><div class="windows" aria-hidden="true"></div><span class="number">99.96%</span>
        </div>
        <div class="timeline-row" data-service-id="payments" data-windows="000000000000000001122110000000">
          <strong>payments</strong><div class="windows" aria-hidden="true"></div><span class="number">98.72%</span>
        </div>
        <div class="timeline-row" data-service-id="search" data-windows="000000000000000000000000000000">
          <strong>search</strong><div class="windows" aria-hidden="true"></div><span class="number">100%</span>
        </div>
      </div>
      <div class="timeline-foot">
        <div class="legend meta" aria-hidden="true">
          <span><i class="window"></i>正常</span><span><i class="window" data-tone="warning"></i>降级</span><span><i class="window" data-tone="danger"></i>中断</span>
        </div>
        <p class="meta" role="status" aria-atomic="true" data-status></p>
      </div>
      <details class="data-disclosure"><summary>查看异常窗口</summary><dl data-incidents></dl></details>
    </section>
  </main>
</body>
</html>
