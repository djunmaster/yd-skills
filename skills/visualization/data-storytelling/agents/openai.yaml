display_name: Data Storytelling
short_description: 可视化 SVG 图画叙事 + 1–6 编号逻辑讲解页，带严格布局与图文同步审计
default_prompt: 帮我梳理这段内容并生成逻辑清晰的深色可视化讲解页：先用 1→N 逻辑总纲理清全文因果主线，章节之间承上启下；每个核心章节优先绘制具象的可视化 SVG 界面、场景、视觉隐喻或前后分屏图画（不要退化成普通方框+箭头的框线图，须通过去字可辨检验），在画面关键位置标上 1、2、3、4、5、6 编号锚点，并在图下按 1、2、3、4、5、6 分点递进讲清原因、机制、边界与行动；需要局部特写时把小图嵌在对应分点内。保持证据诚实与边界清晰，复杂页面可并行生产，交付前运行桌面端与移动端 audit_svg_layout.py --strict 审计并目检截图。
