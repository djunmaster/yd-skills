display_name: Data Storytelling
short_description: 案例、判断与行动逐项图解，带并行生产和 SVG 审计
default_prompt: 帮我整理这段内容，先用全景图交代主线，再把每个独立关系拆成单独的定制 SVG 场景图、数据图或关系图；场景、判断规则、执行顺序和结果不要挤在同一张图里。案例、判断表和执行清单都逐项配图，用具体对象、前后变化和操作产物解释内容，不能只给编号、图标或文字方框。突出主判断、关键对象和风险提示，使用有层级的粗细线框与加粗文字，补充文字解释和证据边界。复杂页面按一图一 Agent 并行生产，每张图执行布局契约与浏览器审计，并核对整页解释覆盖；如需要，生成深色技术讲解风格的完整 HTML 页面。
